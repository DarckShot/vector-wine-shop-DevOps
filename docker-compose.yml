services:
  backend:
    image: wines_rag_backend
    build: ./backend
    container_name: wines_rag_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HF_HOME=/app/.cache/huggingface
      - FASTEMBED_CACHE_PATH=/app/.cache/fastembed
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - wines_rag_network
    volumes:
      - ./config.yaml:/app/config.yaml:ro
  qdrant-loader:
    build: ./qdrant_loader
    container_name: qdrant_loader
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - wines_rag_network
    restart: "no"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - wines_rag_network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: wines_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wines_rag_network
    restart: unless-stopped

volumes:
  qdrant_storage:

networks:
  wines_rag_network:
    driver: bridge
