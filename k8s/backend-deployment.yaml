apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: wine-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: darckshot/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "768Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
