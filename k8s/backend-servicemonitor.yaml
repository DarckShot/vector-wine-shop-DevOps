# Назначение: настраивает Prometheus Operator на сбор метрик backend с /metrics.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-monitor
  namespace: wine-app
  labels:
    release: kube-prom-stack
spec:
  namespaceSelector:
    matchNames:
      - wine-app
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
