 # Синхронизирует манифесты из репозитория (путь k8s) в namespace wine-app
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wine-shop
  namespace: argocd
spec:
  project: default

  source:
    repoURL: ssh://git@ssh.github.com:443/DarckShot/vector-wine-shop-DevOps.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: wine-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
