# Назначение: разворачивает векторную базу Qdrant, которую использует backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: wine-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.13.4
          ports:
            - containerPort: 6333
          env:
            - name: QDRANT__INFERENCE__ENABLED
              value: "true"
            - name: QDRANT__API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: QDRANT__API_KEY
            - name: QDRANT__SERVICE__API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: QDRANT__SERVICE__API_KEY
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
      volumes:
        - name: qdrant-storage
          persistentVolumeClaim:
            claimName: qdrant-storage-pvc
