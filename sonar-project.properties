sonar.projectKey=wine-shop
sonar.projectName=Wine Shop
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/wines_rag,frontend/src
sonar.tests=backend/src/tests,frontend/src

sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.test.inclusions=backend/src/tests/**/*,frontend/src/**/*.test.*,frontend/src/**/*.spec.*
sonar.coverage.exclusions=backend/src/tests/**,frontend/src/**/*.test.*,frontend/src/**/*.spec.*

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.venv/**,**/venv/**,**/__pycache__/**