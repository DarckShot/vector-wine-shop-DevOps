name: CI

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install deps (incl. dev)
        run: uv sync --group dev

      - name: Run tests with coverage
        run: |
          uv run pytest -q \
            --cov=src/wines_rag \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-report=html:coverage-html \
            --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/coverage-html/

  backend-build:
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install deps (incl. dev)
        run: uv sync --group dev

      - name: Build package
        run: uv build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist

  frontend-test:
    runs-on: ubuntu-latest
    needs: backend-build
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage --coverage.reporter=lcov --coverage.thresholds.lines=80

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  sonarqube:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  qdrant-loader-push-dockerhub:
    runs-on: ubuntu-latest
    needs: [backend-test, backend-build, frontend-test, frontend-build, sonarqube]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build qdrant_loader Docker image
        run: docker build -t docker.io/${{ env.DOCKERHUB_USERNAME }}/qdrant-loader:latest ./qdrant_loader

      - name: Push qdrant_loader Docker image
        run: docker push docker.io/${{ env.DOCKERHUB_USERNAME }}/qdrant-loader:latest

  backend-push-dockerhub:
    runs-on: ubuntu-latest
    needs: [backend-test, backend-build, frontend-test, frontend-build, sonarqube]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend Docker image
        run: docker build -t docker.io/${{ env.DOCKERHUB_USERNAME }}/backend:latest ./backend

      - name: Push backend Docker image
        run: docker push docker.io/${{ env.DOCKERHUB_USERNAME }}/backend:latest

  frontend-push-dockerhub:
    runs-on: ubuntu-latest
    needs: [backend-test, backend-build, frontend-test, frontend-build, sonarqube]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create frontend .env from secret (or empty)
        run: |
          mkdir -p frontend
          printf '%s' "${{ secrets.FRONTEND_ENV }}" > frontend/.env
          echo "frontend/.env prepared for Docker build"

      - name: Build frontend Docker image
        run: docker build -t docker.io/${{ env.DOCKERHUB_USERNAME }}/frontend:latest ./frontend

      - name: Push frontend Docker image
        run: docker push docker.io/${{ env.DOCKERHUB_USERNAME }}/frontend:latest

  notify:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-test
      - backend-build
      - frontend-test
      - frontend-build
      - sonarqube
      - backend-push-dockerhub
      - frontend-push-dockerhub
      - qdrant-loader-push-dockerhub

    steps:
      - name: Send VK notification
        run: |
          RESULT="${{ contains(needs.*.result, 'failure') && 'FAILED' || 'SUCCESS' }}"

          curl -s "https://api.vk.com/method/messages.send" \
            -d "peer_id=${{ secrets.VK_CHAT_ID }}" \
            -d "message=Wine Shop CI/CD finished. Status: ${RESULT}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "random_id=${{ github.run_id }}" \
            -d "access_token=${{ secrets.VK_TOKEN }}" \
            -d "v=5.199"
