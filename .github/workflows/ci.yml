name: CI

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install deps (incl. dev)
        run: uv sync --group dev

      - name: Run tests with coverage
        run: |
          uv run pytest -q \
            --cov=src/wines_rag \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-report=html:coverage-html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/coverage-html/

  backend-build:
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install deps (incl. dev)
        run: uv sync --group dev

      - name: Build package
        run: uv build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist

  frontend-test:
    runs-on: ubuntu-latest
    needs: backend-build
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Run tests
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  qdrant-loader-push-dockerhub:
    runs-on: ubuntu-latest
    needs: [backend-test, backend-build, frontend-test, frontend-build]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build qdrant_loader Docker image
        run: docker build -t docker.io/${{ env.DOCKERHUB_USERNAME }}/qdrant-loader:latest ./qdrant_loader

      - name: Push qdrant_loader Docker image
        run: docker push docker.io/${{ env.DOCKERHUB_USERNAME }}/qdrant-loader:latest

  backend-push-dockerhub:
    runs-on: ubuntu-latest
    needs: [backend-test, backend-build, frontend-test, frontend-build]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend Docker image
        run: docker build -t docker.io/${{ env.DOCKERHUB_USERNAME }}/backend:latest ./backend

      - name: Push backend Docker image
        run: docker push docker.io/${{ env.DOCKERHUB_USERNAME }}/backend:latest

  frontend-push-dockerhub:
    runs-on: ubuntu-latest
    needs: [backend-test, backend-build, frontend-test, frontend-build]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create frontend .env from secret (or empty)
        run: |
          mkdir -p frontend
          printf '%s' "${{ secrets.FRONTEND_ENV }}" > frontend/.env
          echo "frontend/.env prepared for Docker build"

      - name: Build frontend Docker image
        run: docker build -t docker.io/${{ env.DOCKERHUB_USERNAME }}/frontend:latest ./frontend

      - name: Push frontend Docker image
        run: docker push docker.io/${{ env.DOCKERHUB_USERNAME }}/frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs:
      - qdrant-loader-push-dockerhub
      - backend-push-dockerhub
      - frontend-push-dockerhub
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply all k8s manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/qdrant-pvc.yaml
          kubectl apply -f k8s/qdrant-deployment.yaml
          kubectl apply -f k8s/qdrant-service.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/backend-servicemonitor.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/frontend-service.yaml
          kubectl apply -f k8s/hpa-backend.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Wait for Qdrant to be ready
        run: kubectl rollout status deployment/qdrant -n wine-app --timeout=120s

      - name: Run qdrant-loader Job
        run: |
          kubectl delete job qdrant-loader -n wine-app --ignore-not-found
          kubectl apply -f k8s/qdrant-loader-job.yaml
          kubectl wait job/qdrant-loader -n wine-app --for=condition=complete --timeout=180s

      - name: Restart backend after data load
        run: |
          kubectl rollout restart deployment/backend -n wine-app
          kubectl rollout status deployment/backend -n wine-app --timeout=120s
