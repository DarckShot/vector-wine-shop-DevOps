- name: Install Docker on VM
  hosts: servers
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true

    - name: Install Docker engine and compose plugin
      apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Start and enable Docker
      service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true
